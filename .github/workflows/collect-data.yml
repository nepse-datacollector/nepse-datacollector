name: NEPSE Data Collection

on:
  # Run every 5 minutes during NEPSE trading hours
  # Nepal time: 11:00–15:00 (UTC +5:45)
  # UTC equivalent: 05:15–09:15
  schedule:
    - cron: "*/5 5-9 * * 1-5"

  # Allow manual trigger
  workflow_dispatch:

jobs:
  collect-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run NEPSE data collector
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DATA_LAKE_OWNER: ${{ secrets.DATA_LAKE_OWNER }}
          DATA_LAKE_REPO: ${{ secrets.DATA_LAKE_REPO }}
          DATA_LAKE_BRANCH: main
          LOG_TO_FILE: "true"
        run: npm start

      - name: Upload logs if job fails
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: nepse-collection-logs
          path: logs/
          retention-days: 7

